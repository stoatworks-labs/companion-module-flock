name: ci

# Until this existed the repo had no workflow with a `pull_request` trigger at
# all — only a tag-driven release — so Dependabot bumps arrived with no status
# check to gate a merge on and simply accumulated.
#
# The smoke test is the check worth having: it imports the module's real source,
# which pulls in @companion-module/base and the runtime deps for real, so a bump
# that breaks them fails here rather than on someone's rack at a show.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          # package.json pins engines.node to ^22.20; matching it here means the
          # check runs on the same major Companion itself ships.
          node-version: 22
          cache: npm

      # Deliberately a plain `npm ci` — no --legacy-peer-deps. A bump that only
      # installs by ignoring the peer graph is exactly what this is here to catch.
      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      # Bundling is a separate failure mode from running: the module can pass its
      # smoke test and still fail to package, which is what a release actually
      # ships. Same command release.yml runs, so a red here means a red release.
      - name: Build module package
        run: npm run package

      # Packaging succeeding is not the same as the package being loadable. What
      # Companion (and Burrow) look for is package.json in the archive's root
      # directory, and release.yml once shipped an archive that had it a level
      # deeper. Assert the shape here, where a PR can go red for it.
      - name: Check the package is loadable
        shell: bash
        run: |
          set -euo pipefail
          f=$(ls -1 *.tgz 2>/dev/null | head -n 1 || true)
          [ -n "$f" ] || { echo "::error::companion-module-build produced no .tgz"; exit 1; }
          root=$(tar tzf "$f" | head -n 1 | cut -d/ -f1)
          for want in "$root/package.json" "$root/companion/manifest.json"; do
            tar tzf "$f" | grep -qx "$want" \
              || { echo "::error::$f has no $want, so Companion would not load it"; exit 1; }
          done
          echo "$f: ok — root is $root/"
